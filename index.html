<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tool Hub · Maditor</title>
    
    <!-- FAVICON (biểu tượng tab) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f7b2c1'/><text x='50' y='70' font-size='65' font-family='Arial' text-anchor='middle' fill='%232d1b1b' font-weight='bold'>M</text></svg>" />

    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ----- RESET & NỀN ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #ffe8f0, #ffd9e8);
            min-height: 100vh;
            padding: 20px 12px;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ----- CONTAINER CHÍNH ----- */
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 40px 40px 30px 30px;
            padding: 24px 20px 30px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15), 0 0 0 3px #fff8, 0 0 0 6px #f7b2c1;
            border: 2px solid #2d1b1b;
        }

        /* ----- HEADER ----- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 4px dashed #d66b86;
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            letter-spacing: 1px;
            color: #3d1f2b;
            text-shadow: 4px 4px 0 #f7b2c1, 2px 2px 0 #2d1b1b;
            transform: rotate(-0.5deg);
        }

        .header .sub {
            font-weight: 700;
            font-size: 1rem;
            background: #2d1b1b;
            color: #fff5e6;
            padding: 5px 16px;
            border-radius: 40px;
            box-shadow: 3px 3px 0 #d66b86;
            border: 2px solid #fff;
        }

        /* ----- HAI CỘT (FLEX) ----- */
        .columns {
            display: flex;
            gap: 20px;
            margin-top: 6px;
            margin-bottom: 20px;
        }

        .column {
            flex: 1;
            background: #fffcf7;
            border-radius: 28px;
            border: 3px solid #2d1b1b;
            box-shadow: 6px 6px 0 #b35d7a;
            padding: 16px 14px 14px;
            transition: all 0.12s;
        }

        .column:hover {
            transform: translate(1px, 1px);
            box-shadow: 5px 5px 0 #b35d7a;
        }

        .column h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: #2d1b1b;
            text-align: center;
            margin-bottom: 14px;
            letter-spacing: 1px;
            border-bottom: 3px dashed #d66b86;
            padding-bottom: 6px;
        }

        /* ----- DANH SÁCH ITEM TRONG CỘT ----- */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-radius: 20px;
            border: 2px solid #2d1b1b;
            box-shadow: inset 0 -3px 0 #d3a0b0;
            padding: 6px 12px 6px 16px;
            min-height: 48px;
            transition: 0.08s;
        }

        .item .name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1f131a;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item .name .emoji {
            font-size: 1.2rem;
            filter: drop-shadow(1px 1px 0 #d66b86);
        }

        .btn {
            display: inline-block;
            padding: 5px 14px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            border: 2px solid #2d1b1b;
            border-radius: 30px;
            background: #fdeff2;
            color: #2d1b1b;
            text-decoration: none;
            box-shadow: 3px 3px 0 #2d1b1b;
            transition: all 0.08s linear;
            cursor: pointer;
            letter-spacing: 0.3px;
            text-align: center;
            min-width: 70px;
            flex-shrink: 0;
        }

        .btn-go {
            background: #b0d9b1;
        }

        .btn-download {
            background: #f9c7d3;
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #2d1b1b;
        }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        /* ----- DÒNG CẢNH BÁO ----- */
        .warning {
            margin-top: 8px;
            padding: 12px 18px;
            background: #fff0ee;
            border: 3px solid #2d1b1b;
            border-radius: 30px;
            box-shadow: 5px 5px 0 #b35d7a;
            color: #2d1b1b;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .warning .icon {
            font-size: 1.6rem;
            filter: drop-shadow(2px 2px 0 #d66b86);
        }

        .warning span {
            line-height: 1.4;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 700px) {
            .columns {
                flex-direction: column;
                gap: 16px;
            }
            .container {
                padding: 18px 14px 22px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .warning {
                font-size: 0.8rem;
                padding: 10px 14px;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.2rem;
            }
            .column h2 {
                font-size: 1.1rem;
            }
            .item .name {
                font-size: 0.8rem;
            }
            .btn {
                font-size: 0.7rem;
                min-width: 60px;
                padding: 4px 10px;
            }
            .warning {
                font-size: 0.75rem;
                padding: 8px 12px;
            }
        }

        /* ----- ITEM ẨN (PLACEHOLDER) ----- */
        .item.placeholder {
            opacity: 0.3;
            pointer-events: none;
        }
        .item.placeholder .btn {
            visibility: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1>🎬 Tool Hub</h1>
        <span class="sub">✨ Maditor ✨</span>
    </div>

    <!-- HAI CỘT -->
    <div class="columns">
        <div class="column web-column">
            <h2>🌐 Website</h2>
            <div id="webList" class="item-list"></div>
        </div>
        <div class="column download-column">
            <h2>📦 CEP and Portable</h2>
            <div id="downloadList" class="item-list"></div>
        </div>
    </div>

    <!-- DÒNG CẢNH BÁO -->
    <div class="warning">
        <span>
            <strong>⚠️ Maditor không nhận Donate</strong> bằng bất kỳ hình thức nào.
            <br>⚠️Cẩn thận đề phòng những hành vi dùng sản phẩm của Maditor để kêu gọi quyên góp hoặc Donate!!
        </span>
    </div>
</div>

<script>
    // ================================================================
    //  📦 DỮ LIỆU CÔNG CỤ – THÊM / SỬA TẠI ĐÂY
    // ================================================================
    const toolsData = [
        {
            web: { name: "VisionBox-Web (Chép và Dịch)", url: "https://maditor.github.io/visionbox-web/" },
            download: { name: "VisionBox", url: "https://github.com/Maditor/VisionBox/releases/download/V1.4/VisionBox.V1.4.zip" }
        },
        {
            web: { name: "Webtool (Cắt Ghép và Logo)", url: "https://maditor.github.io/Webtool/" },
            download: { name: "TypoCore", url: "https://github.com/Maditor/TypoCore/releases/download/V1.3.1/TypoCorev1.3.1.Fix.Bug.zip" }
        },
        {
            web: { name: "Typoon (Đang phát triển)", url: "https://maditor.github.io/Typoon-web/" },
            download: { name: "TypoVision", url: "https://github.com/Maditor/TypoVision/releases/download/V1.0/TypoVision.zip" }
        }
        // 👇 THÊM CẶP MỚI VÀO ĐÂY:
        // {
        //     web: { name: "Tên web", url: "đường_dẫn" },
        //     download: { name: "Tên download", url: "đường_dẫn" }
        // },
        // Hoặc nếu thiếu một bên: web: null
    ];

    // ================================================================
    //  RENDER HAI CỘT
    // ================================================================
    function renderColumns() {
        const webList = document.getElementById('webList');
        const downloadList = document.getElementById('downloadList');
        webList.innerHTML = '';
        downloadList.innerHTML = '';

        const webs = toolsData.map(item => item.web).filter(w => w !== null);
        const downloads = toolsData.map(item => item.download).filter(d => d !== null);

        const maxLen = Math.max(webs.length, downloads.length);

        for (let i = 0; i < maxLen; i++) {
            // Web
            const webItem = document.createElement('div');
            webItem.className = 'item';
            if (i < webs.length) {
                webItem.innerHTML = `
                    <span class="name"><span class="emoji">🌐</span> ${webs[i].name}</span>
                    <a href="${webs[i].url}" target="_blank" class="btn btn-go">Go to →</a>
                `;
            } else {
                webItem.classList.add('placeholder');
                webItem.innerHTML = `<span class="name">—</span><span class="btn" style="visibility:hidden;">Go</span>`;
            }
            webList.appendChild(webItem);

            // Download
            const downloadItem = document.createElement('div');
            downloadItem.className = 'item';
            if (i < downloads.length) {
                downloadItem.innerHTML = `
                    <span class="name"><span class="emoji">📦</span> ${downloads[i].name}</span>
                    <a href="${downloads[i].url}" target="_blank" class="btn btn-download">⬇ Download</a>
                `;
            } else {
                downloadItem.classList.add('placeholder');
                downloadItem.innerHTML = `<span class="name">—</span><span class="btn" style="visibility:hidden;">Download</span>`;
            }
            downloadList.appendChild(downloadItem);
        }
    }

    document.addEventListener('DOMContentLoaded', renderColumns);
</script>

</body>
</html>
