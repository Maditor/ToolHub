<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Tool Hub · Maditor</title>

    <!-- FAVICON (biểu tượng tab) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f7b2c1'/><text x='50' y='70' font-size='65' font-family='Arial' text-anchor='middle' fill='%232d1b1b' font-weight='bold'>M</text></svg>" />

    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ----- RESET & NỀN ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ----- BIẾN MÀU: CHẾ ĐỘ SÁNG (mặc định) ----- */
        :root {
            --bg-grad-1: #ffe8f0;
            --bg-grad-2: #ffd9e8;
            --dot-color: rgba(45,27,27,0.07);
            --container-bg: rgba(255, 255, 255, 0.7);
            --outer-ring: #f7b2c1;
            --border-color: #2d1b1b;
            --text-main: #3d1f2b;
            --heading-shadow-1: #f7b2c1;
            --heading-shadow-2: #2d1b1b;
            --badge-bg: #2d1b1b;
            --badge-text: #fff5e6;
            --badge-border: #fff;
            --badge-shadow: #d66b86;
            --dashed-color: #d66b86;
            --column-bg: #fffcf7;
            --column-shadow: #b35d7a;
            --column-heading: #2d1b1b;
            --item-bg: #fff;
            --item-inner-shadow: #d3a0b0;
            --item-hover-shadow: #b35d7a;
            --item-hover-border: #d66b86;
            --item-name-color: #1f131a;
            --btn-detail-bg: #cfe8fb;
            --btn-go-bg: #b0d9b1;
            --btn-download-bg: #f9c7d3;
            --btn-text: #2d1b1b;
            --btn-border: #2d1b1b;
            --btn-shadow: #2d1b1b;
            --warning-bg: #fff0ee;
            --warning-shadow: #b35d7a;
            --warning-text: #2d1b1b;
            --status-text: #6b3a4a;
            --sparkle-shadow: rgba(45,27,27,0.25);
            --toggle-track-bg: #2d1b1b;
            --toggle-thumb-bg: #fff5e6;
        }

        /* ----- BIẾN MÀU: CHẾ ĐỘ TỐI (tông trầm, hạn chế hồng) ----- */
        body.dark-mode {
            --bg-grad-1: #131019;
            --bg-grad-2: #1b1724;
            --dot-color: rgba(210, 202, 226, 0.05);
            --container-bg: rgba(22, 19, 29, 0.82);
            --outer-ring: #5f5478;
            --border-color: #d6d0e2;
            --text-main: #e7e2f0;
            --heading-shadow-1: #4a4062;
            --heading-shadow-2: #0c0a11;
            --badge-bg: #453b5c;
            --badge-text: #efeaf7;
            --badge-border: #d6d0e2;
            --badge-shadow: #262130;
            --dashed-color: #5f5478;
            --column-bg: #1e1a29;
            --column-shadow: #0c0a11;
            --column-heading: #e7e2f0;
            --item-bg: #282334;
            --item-inner-shadow: #3a3348;
            --item-hover-shadow: #5f5478;
            --item-hover-border: #8a7fa8;
            --item-name-color: #ece7f5;
            --btn-detail-bg: #2c4456;
            --btn-go-bg: #2a4436;
            --btn-download-bg: #453548;
            --btn-text: #ece7f5;
            --btn-border: #d6d0e2;
            --btn-shadow: #0c0a11;
            --warning-bg: #211c2b;
            --warning-shadow: #0c0a11;
            --warning-text: #d6d0e2;
            --status-text: #ada2c2;
            --sparkle-shadow: rgba(210, 202, 226, 0.25);
            --toggle-track-bg: #453b5c;
            --toggle-thumb-bg: #1b1724;
        }

        body {
            background:
                radial-gradient(circle, var(--dot-color) 1.5px, transparent 1.5px) 0 0 / 22px 22px,
                linear-gradient(145deg, var(--bg-grad-1), var(--bg-grad-2));
            background-attachment: fixed;
            animation: dotsDrift 18s linear infinite;
            min-height: 100vh;
            padding: 20px 12px;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            transition: background-color 0.4s ease;
        }

        @keyframes dotsDrift {
            0%   { background-position: 0 0, 0 0; }
            100% { background-position: 220px 110px, 0 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        /* ----- CONTAINER CHÍNH ----- */
        .container {
            position: relative;
            max-width: 1120px;
            width: 100%;
            background: var(--container-bg);
            backdrop-filter: blur(6px);
            border-radius: 40px 40px 30px 30px;
            padding: 24px 20px 30px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15), 0 0 0 3px #fff8, 0 0 0 6px var(--outer-ring);
            border: 2px solid var(--border-color);
            animation: popIn 0.55s cubic-bezier(.26,1.6,.44,1) both;
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        @keyframes popIn {
            0%   { opacity: 0; transform: scale(0.85) translateY(24px); }
            70%  { opacity: 1; transform: scale(1.02) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ----- SPARKLES TRANG TRÍ ----- */
        .sparkle {
            position: absolute;
            font-size: 1.4rem;
            pointer-events: none;
            animation: sparkleFloat 3.6s ease-in-out infinite;
            filter: drop-shadow(1px 1px 0 var(--sparkle-shadow));
            z-index: 0;
        }
        .sparkle.s1 { top: -10px; left: 26px; animation-delay: 0s; }
        .sparkle.s2 { top: 8px; right: 40px; font-size: 1.1rem; animation-delay: 0.9s; }
        .sparkle.s3 { bottom: 18px; left: -6px; font-size: 1.2rem; animation-delay: 1.7s; }
        .sparkle.s4 { bottom: -8px; right: 10px; font-size: 1.3rem; animation-delay: 0.4s; }

        @keyframes sparkleFloat {
            0%, 100% { transform: translateY(0) rotate(-6deg); opacity: 0.85; }
            50%      { transform: translateY(-9px) rotate(10deg); opacity: 1; }
        }

        /* ----- HEADER ----- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 4px dashed var(--dashed-color);
            position: relative;
            z-index: 1;
            transition: border-color 0.4s ease;
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            letter-spacing: 1px;
            color: var(--text-main);
            text-shadow: 4px 4px 0 var(--heading-shadow-1), 2px 2px 0 var(--heading-shadow-2);
            transform: rotate(-0.5deg);
            display: inline-block;
            animation: wiggle 3.2s ease-in-out infinite;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-0.5deg); }
            50%      { transform: rotate(2deg) translateY(-2px); }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .sub {
            font-weight: 700;
            font-size: 1rem;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 5px 16px;
            border-radius: 40px;
            box-shadow: 3px 3px 0 var(--badge-shadow);
            border: 2px solid var(--badge-border);
            animation: pulseBadge 2.4s ease-in-out infinite;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        @keyframes pulseBadge {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50%      { transform: scale(1.06) rotate(-2deg); }
        }

        /* ----- CÔNG TẮC DARK MODE ----- */
        .theme-toggle {
            appearance: none;
            border: 2px solid var(--border-color);
            background: var(--toggle-track-bg);
            border-radius: 40px;
            width: 54px;
            height: 30px;
            padding: 2px;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--badge-shadow);
            transition: background-color 0.35s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.08s linear;
            display: flex;
            align-items: center;
        }

        .theme-toggle:hover {
            transform: translate(1px, 1px) scale(1.03);
            box-shadow: 2px 2px 0 var(--badge-shadow);
        }

        .theme-toggle:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .theme-toggle .toggle-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--toggle-thumb-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transform: translateX(0);
            transition: transform 0.35s cubic-bezier(.34,1.6,.64,1), background-color 0.35s ease;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.25);
        }

        body.dark-mode .theme-toggle .toggle-thumb {
            transform: translateX(24px);
        }

        /* ----- HAI CỘT (FLEX) ----- */
        .columns {
            display: flex;
            gap: 28px;
            margin-top: 6px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .column {
            flex: 1;
            background: var(--column-bg);
            border-radius: 28px;
            border: 3px solid var(--border-color);
            box-shadow: 6px 6px 0 var(--column-shadow);
            padding: 16px 20px 14px;
            opacity: 0;
            animation: colEnter 0.5s cubic-bezier(.26,1.4,.44,1) 0.15s both;
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }
        .download-column { animation-delay: 0.28s; }

        @keyframes colEnter {
            0%   { opacity: 0; transform: translateY(18px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .column h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: var(--column-heading);
            text-align: center;
            margin-bottom: 14px;
            letter-spacing: 1px;
            border-bottom: 3px dashed var(--dashed-color);
            padding-bottom: 6px;
            transition: color 0.4s ease, border-color 0.4s ease;
        }

        /* ----- DANH SÁCH ITEM TRONG CỘT ----- */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--item-bg);
            border-radius: 20px;
            border: 2px solid var(--border-color);
            box-shadow: inset 0 -3px 0 var(--item-inner-shadow), 3px 3px 0 transparent;
            padding: 6px 10px 6px 16px;
            min-height: 48px;
            opacity: 0;
            transform: translateY(14px);
            animation: itemIn 0.45s cubic-bezier(.26,1.5,.44,1) forwards;
            animation-delay: calc(0.35s + var(--i, 0) * 0.08s);
            transition: transform 0.16s cubic-bezier(.34,1.6,.64,1), box-shadow 0.16s ease, border-color 0.16s ease, background-color 0.4s ease;
        }

        @keyframes itemIn {
            0%   { opacity: 0; transform: translateY(14px) scale(0.94); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Hiệu ứng hover TỪNG Ô, không phải cả cột */
        .item:not(.placeholder):hover {
            transform: translateY(-4px) rotate(-1deg) scale(1.025);
            box-shadow: inset 0 -3px 0 var(--item-inner-shadow), 5px 6px 0 var(--item-hover-shadow);
            border-color: var(--item-hover-border);
            z-index: 2;
        }
        .item:not(.placeholder):nth-child(even):hover {
            transform: translateY(-4px) rotate(1deg) scale(1.025);
        }

        .item:not(.placeholder):hover .emoji {
            animation: emojiBounce 0.5s ease-in-out;
        }

        @keyframes emojiBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            30%      { transform: translateY(-5px) rotate(-12deg); }
            60%      { transform: translateY(1px) rotate(8deg); }
        }

        .item .name {
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--item-name-color);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.4s ease;
        }

        .item .name .emoji {
            font-size: 1.2rem;
            filter: drop-shadow(1px 1px 0 var(--dashed-color));
            display: inline-block;
        }

        .item .actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn {
            display: inline-block;
            padding: 5px 12px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            border: 2px solid var(--btn-border);
            border-radius: 30px;
            background: #fdeff2;
            color: var(--btn-text);
            text-decoration: none;
            box-shadow: 3px 3px 0 var(--btn-shadow);
            transition: all 0.08s linear, background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
            cursor: pointer;
            letter-spacing: 0.3px;
            text-align: center;
            min-width: 58px;
            flex-shrink: 0;
        }

        .btn-detail {
            background: var(--btn-detail-bg);
        }

        .btn-go {
            background: var(--btn-go-bg);
        }

        .btn-download {
            background: var(--btn-download-bg);
        }

        .btn:hover {
            transform: translate(2px, 2px) scale(1.05);
            box-shadow: 1px 1px 0 var(--btn-shadow);
        }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .btn.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: 2px 2px 0 var(--btn-shadow);
            pointer-events: none;
        }

        /* ----- DÒNG CẢNH BÁO ----- */
        .warning {
            margin-top: 8px;
            padding: 12px 18px;
            background: var(--warning-bg);
            border: 3px solid var(--border-color);
            border-radius: 30px;
            box-shadow: 5px 5px 0 var(--warning-shadow);
            color: var(--warning-text);
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
            animation: warnIn 0.5s ease-out 0.7s both;
            transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, color 0.4s ease;
        }

        @keyframes warnIn {
            0%   { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .warning .icon {
            font-size: 1.6rem;
            filter: drop-shadow(2px 2px 0 var(--dashed-color));
            display: inline-block;
            animation: iconShake 2.6s ease-in-out infinite;
        }

        @keyframes iconShake {
            0%, 85%, 100% { transform: rotate(0deg); }
            88%  { transform: rotate(-14deg); }
            91%  { transform: rotate(12deg); }
            94%  { transform: rotate(-8deg); }
            97%  { transform: rotate(4deg); }
        }

        .warning span {
            line-height: 1.4;
        }

        /* ----- TRẠNG THÁI TẢI / LỖI ----- */
        .status-msg {
            text-align: center;
            font-weight: 700;
            padding: 20px 10px;
            color: var(--status-text);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 700px) {
            .columns {
                flex-direction: column;
                gap: 16px;
            }
            .container {
                padding: 18px 14px 22px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .warning {
                font-size: 0.8rem;
                padding: 10px 14px;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.2rem;
            }
            .column h2 {
                font-size: 1.1rem;
            }
            .item {
                flex-wrap: wrap;
                padding: 8px 10px;
            }
            .item .name {
                font-size: 0.8rem;
            }
            .btn {
                font-size: 0.68rem;
                min-width: 50px;
                padding: 4px 8px;
            }
            .warning {
                font-size: 0.75rem;
                padding: 8px 12px;
            }
        }

        /* ----- ITEM ẨN (PLACEHOLDER) ----- */
        .item.placeholder {
            opacity: 0.3;
            pointer-events: none;
            animation: itemIn 0.45s cubic-bezier(.26,1.5,.44,1) forwards;
        }
        .item.placeholder .btn {
            visibility: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <span class="sparkle s1">✨</span>
    <span class="sparkle s2">💫</span>
    <span class="sparkle s3">⭐</span>
    <span class="sparkle s4">✨</span>

    <!-- HEADER -->
    <div class="header">
        <h1>🎬 Tool Hub</h1>
        <div class="header-right">
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Chuyển chế độ sáng / tối" title="Chế độ sáng / tối">
                <span class="toggle-thumb">🌙</span>
            </button>
            <span class="sub">✨ Maditor ✨</span>
        </div>
    </div>

    <!-- HAI CỘT -->
    <div class="columns">
        <div class="column web-column">
            <h2>🌐 Website</h2>
            <div id="webList" class="item-list"></div>
        </div>
        <div class="column download-column">
            <h2>📦 CEP and Portable</h2>
            <div id="downloadList" class="item-list"></div>
        </div>
    </div>

    <!-- DÒNG CẢNH BÁO -->
    <div class="warning">
        <span class="icon">⚠️</span>
        <span>
            <strong>Maditor không nhận Donate</strong> bằng bất kỳ hình thức nào.
            <br>Cẩn thận đề phòng những hành vi dùng sản phẩm của Maditor để kêu gọi quyên góp hoặc Donate!!
        </span>
    </div>
</div>

<script>
    // ================================================================
    //  📦 DỮ LIỆU CÔNG CỤ
    //  Toàn bộ danh sách công cụ nằm trong file "data.json" (cùng thư mục
    //  với file index.html này). Muốn thêm/sửa công cụ, chỉ cần mở
    //  data.json và chỉnh sửa — KHÔNG cần đụng vào file HTML này.
    //
    //  Cấu trúc mỗi phần tử trong data.json:
    //  {
    //    "web": { "name": "Tên hiển thị", "url": "link web", "detail": "link giới thiệu" },
    //    "download": { "name": "Tên hiển thị", "url": "link tải", "detail": "link giới thiệu" }
    //  }
    //  - Để trống "detail": "" nếu chưa có trang thông tin (nút Detail sẽ tự mờ đi).
    //  - Nếu một bên không có (vd chỉ có download, không có web), thay cả object bằng null:
    //      "web": null
    //  - Muốn thêm công cụ mới: copy 1 khối { web: {...}, download: {...} } và dán thêm
    //    vào cuối mảng trong data.json, nhớ thêm dấu phẩy ngăn cách.
    // ================================================================

    // Dữ liệu dự phòng, dùng khi trang được mở trực tiếp (file://) và trình
    // duyệt chặn fetch() vì lý do CORS. Nếu bạn đang host qua GitHub Pages /
    // một server thật thì data.json bên ngoài sẽ luôn được ưu tiên dùng.
    const fallbackData = [
        {
            web: { name: "VisionBox-Web", url: "https://maditor.github.io/visionbox-web/", detail: "" },
            download: { name: "VisionBox", url: "https://github.com/Maditor/VisionBox/releases/download/V1.4/VisionBox.V1.4.zip", detail: "" }
        },
        {
            web: { name: "Webtool", url: "https://maditor.github.io/Webtool/", detail: "" },
            download: { name: "TypoCore", url: "https://github.com/Maditor/TypoCore/releases/download/V1.3.1/TypoCorev1.3.1.Fix.Bug.zip", detail: "" }
        },
        {
            web: { name: "Typoon (Đang phát triển)", url: "https://maditor.github.io/Typoon-web/", detail: "" },
            download: { name: "TypoVision", url: "https://github.com/Maditor/TypoVision/releases/download/V1.0/TypoVision.zip", detail: "" }
        }
    ];

    function buildActions({ detailUrl, mainUrl, mainLabel, mainClass }) {
        const hasDetail = !!(detailUrl && detailUrl.trim());
        const detailBtn = hasDetail
            ? `<a href="${detailUrl}" target="_blank" class="btn btn-detail">Detail</a>`
            : `<span class="btn btn-detail disabled">Detail</span>`;
        const mainBtn = `<a href="${mainUrl}" target="_blank" class="btn ${mainClass}">${mainLabel}</a>`;
        return `<span class="actions">${detailBtn}${mainBtn}</span>`;
    }

    function renderColumns(toolsData) {
        const webList = document.getElementById('webList');
        const downloadList = document.getElementById('downloadList');
        webList.innerHTML = '';
        downloadList.innerHTML = '';

        const webs = toolsData.map(item => item.web).filter(w => w !== null && w !== undefined);
        const downloads = toolsData.map(item => item.download).filter(d => d !== null && d !== undefined);

        const maxLen = Math.max(webs.length, downloads.length);

        for (let i = 0; i < maxLen; i++) {
            // Web
            const webItem = document.createElement('div');
            webItem.className = 'item';
            webItem.style.setProperty('--i', i);
            if (i < webs.length) {
                webItem.innerHTML = `
                    <span class="name"><span class="emoji">🌐</span> ${webs[i].name}</span>
                    ${buildActions({ detailUrl: webs[i].detail, mainUrl: webs[i].url, mainLabel: 'Go to →', mainClass: 'btn-go' })}
                `;
            } else {
                webItem.classList.add('placeholder');
                webItem.innerHTML = `<span class="name">—</span><span class="actions"><span class="btn" style="visibility:hidden;">Go</span></span>`;
            }
            webList.appendChild(webItem);

            // Download
            const downloadItem = document.createElement('div');
            downloadItem.className = 'item';
            downloadItem.style.setProperty('--i', i);
            if (i < downloads.length) {
                downloadItem.innerHTML = `
                    <span class="name"><span class="emoji">📦</span> ${downloads[i].name}</span>
                    ${buildActions({ detailUrl: downloads[i].detail, mainUrl: downloads[i].url, mainLabel: '⬇ Download', mainClass: 'btn-download' })}
                `;
            } else {
                downloadItem.classList.add('placeholder');
                downloadItem.innerHTML = `<span class="name">—</span><span class="actions"><span class="btn" style="visibility:hidden;">Download</span></span>`;
            }
            downloadList.appendChild(downloadItem);
        }
    }

    // Chủ động xoá mọi dữ liệu cũ có thể đã bị lưu (localStorage/sessionStorage)
    // để trang không bao giờ dùng dữ liệu đã lưu trước đó, luôn chỉ dùng data.json.
    // (Công tắc dark mode bên dưới CŨNG không lưu vào localStorage vì lý do này —
    // mỗi lần mở trang sẽ luôn bắt đầu ở chế độ sáng.)
    try {
        localStorage.clear();
        sessionStorage.clear();
    } catch (e) {
        // Một số trình duyệt/chế độ có thể chặn truy cập storage, bỏ qua lỗi này.
    }

    // ----- CÔNG TẮC DARK MODE -----
    const themeToggle = document.getElementById('themeToggle');
    const thumb = themeToggle.querySelector('.toggle-thumb');
    themeToggle.addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark-mode');
        thumb.textContent = isDark ? '☀️' : '🌙';
        themeToggle.setAttribute('aria-pressed', isDark ? 'true' : 'false');
    });

    document.addEventListener('DOMContentLoaded', () => {
        // Gắn thêm timestamp để "phá cache" — buộc trình duyệt/CDN của GitHub
        // Pages phải coi đây là một URL khác mỗi lần tải và luôn lấy bản mới
        // nhất của data.json, thay vì trả về bản đã lưu trong cache.
        const cacheBustUrl = `data.json?t=${Date.now()}`;
        fetch(cacheBustUrl, { cache: 'no-store' })
            .then(res => {
                if (!res.ok) throw new Error('Không đọc được data.json');
                return res.json();
            })
            .then(toolsData => renderColumns(toolsData))
            .catch(() => {
                // Không fetch được (thường do mở file trực tiếp bằng file://).
                // Dùng dữ liệu dự phòng để trang vẫn hoạt động bình thường.
                renderColumns(fallbackData);
            });
    });
</script>

</body>
</html>
