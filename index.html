<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Tool Hub · Maditor</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="tool-hub-icon.svg" />

    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}

        .root{
          --bg:#f5f0f2;--surf:#fff;--bd:#e0cdd5;--tx:#2d1b1b;--mu:#9a6b7a;
          --hbg:#f7b2c1;--htx:#2d1b1b;--div:#e0cdd5;
          --chip:#fff;--chip-h:#fdf0f3;
          --db:#dbeeff;--gb:#c9ebd0;--lb:#fce4ea;--pb:#e6e0fc;
          --cbbd:#c0a0b0;--cbtx:#2d1b1b;
          --wbg:#fff8e1;--wbd:#e8c441;--wtx:#5c4a10;
          font-family:'Quicksand',sans-serif;
          min-height:100vh;
          background:var(--bg);
          display:flex;align-items:flex-start;justify-content:center;
          padding:24px 14px 32px;
          transition:background .3s;
        }
        .root.dk{
          --bg:#111019;--surf:#1a1726;--bd:#2e2a40;--tx:#e4dff0;--mu:#7a7090;
          --hbg:#25203a;--htx:#e4dff0;--div:#2e2a40;
          --chip:#1a1726;--chip-h:#201c30;
          --db:#1a2a38;--gb:#182820;--lb:#281828;--pb:#221e38;
          --cbbd:#4a4265;--cbtx:#c8c0e0;
          --wbg:#181610;--wbd:#5c4c10;--wtx:#c8b840;
        }
        .page{width:100%;max-width:980px;display:flex;flex-direction:column;gap:14px;padding-bottom:64px;}

        /* header */
        .hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;}
        .hdr h1{font-family:'Fredoka One',cursive;font-size:1.35rem;color:var(--tx);letter-spacing:.4px;display:flex;align-items:center;gap:7px;}
        .icon-title{width:22px;height:22px;flex-shrink:0;color:var(--tx);}
        .icon-col{width:15px;height:15px;flex-shrink:0;vertical-align:-3px;margin-right:3px;color:var(--htx);}
        .icon-warn{width:16px;height:16px;flex-shrink:0;vertical-align:-3px;margin-right:3px;color:var(--wtx);}
        .icon-toggle{width:11px;height:11px;color:var(--surf);}
        .hdr-left{display:flex;align-items:center;gap:8px;}
        .htag{font-size:.7rem;font-weight:700;color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;}
        .tog{width:40px;height:22px;background:var(--hbg);border:1.5px solid var(--bd);border-radius:20px;
          cursor:pointer;position:relative;flex-shrink:0;transition:background .3s,border-color .3s;}
        .tog-t{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
          background:var(--tx);transition:transform .3s cubic-bezier(.34,1.6,.64,1);font-size:.6rem;
          display:flex;align-items:center;justify-content:center;}
        .dk .tog-t{transform:translateX(18px);}

        /* columns */
        .cols{display:grid;grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));gap:12px;}
        .col{background:var(--surf);border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;transition:background .3s,border-color .3s;}
        .col-hd{background:var(--hbg);color:var(--htx);font-family:'Fredoka One',cursive;font-size:.9rem;
          padding:7px 12px;letter-spacing:.3px;border-bottom:1px solid var(--div);transition:background .3s,border-color .3s;}

        /* chips */
        .chip-list{display:flex;flex-direction:column;}
        .chip{
          display:flex;align-items:center;justify-content:space-between;gap:6px;
          padding:5px 10px;border-bottom:1px solid var(--div);
          background:var(--chip);transition:background .15s,border-color .3s;
        }
        .chip:last-child{border-bottom:none;}
        .chip:hover{background:var(--chip-h);}
        .chip-name{font-size:.8rem;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;transition:color .3s;}
        .chip-btns{display:flex;gap:4px;flex-shrink:0;}
        .cbtn{
          font-family:'Quicksand',sans-serif;font-weight:700;font-size:.65rem;
          padding:2px 8px;border-radius:20px;border:1px solid var(--cbbd);
          text-decoration:none;color:var(--cbtx);cursor:pointer;display:inline-block;
          white-space:nowrap;transition:opacity .15s;
        }
        .cbtn:hover{opacity:.7;}
        .cbtn.disabled{opacity:.25;pointer-events:none;}
        .cbtn-detail{background:var(--db);}
        .cbtn-go{background:var(--gb);}
        .cbtn-dl{background:var(--lb);}
        .cbtn-pt{background:var(--pb);}

        /* warn — thanh cố định dính đáy màn hình */
        .warn{
          position:fixed;left:0;right:0;bottom:0;z-index:50;
          background:var(--wbg);border-top:1px solid var(--wbd);color:var(--wtx);
          font-size:.75rem;font-weight:700;line-height:1.5;text-align:center;
          padding:10px 16px calc(10px + env(safe-area-inset-bottom));
          box-shadow:0 -6px 16px rgba(0,0,0,.10);
          transition:background .3s,color .3s,border-color .3s;
        }

        /* banner khi phải dùng dữ liệu dự phòng */
        .fallback-notice{
          background:#fff3cd;border:1px solid #8a6d1f;color:#5c4a10;
          font-weight:700;font-size:.72rem;border-radius:8px;padding:6px 12px;text-align:center;
        }

        @media(max-width:500px){
          .cols{grid-template-columns:1fr;}
          .chip-name{font-size:.75rem;}
          .page{padding-bottom:84px;}
          .warn{font-size:.7rem;}
        }
    </style>
</head>
<body>

<div class="root" id="root">
    <div class="page">
        <header class="hdr">
            <div class="hdr-left">
                <h1>
                    <svg class="icon-title" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="9" width="18" height="12" rx="2"/>
                        <path d="M3 9 4.5 4h3L6 9zM9 9l1.5-5h3L12 9zM15 9l1.5-5h3L18 9z"/>
                    </svg>
                    Tool Hub
                </h1>
                <span class="htag">Maditor</span>
            </div>
            <button class="tog" id="themeToggle" type="button" aria-label="Đổi giao diện">
                <span class="tog-t" id="togThumb">
                    <svg class="icon-toggle" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
                    </svg>
                </span>
            </button>
        </header>

        <div id="fallbackSlot"></div>

        <div class="cols">
            <div class="col">
                <div class="col-hd" id="webHd">
                    <svg class="icon-col" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M3 12h18M12 3c2.5 2.5 3.8 6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-6-3.8-9s1.3-6.5 3.8-9z"/>
                    </svg>
                    Website (<span id="webCount">0</span>)
                </div>
                <div class="chip-list" id="webList"></div>
            </div>
            <div class="col">
                <div class="col-hd" id="cepHd">
                    <svg class="icon-col" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19.439 7.85c-.049.322.059.648.289.878l1.568 1.568c.47.47.706 1.087.706 1.704s-.235 1.233-.706 1.704l-1.611 1.611a.98.98 0 0 1-.837.276c-.47-.07-.802-.48-.968-.925a2.501 2.501 0 1 0-3.214 3.214c.446.166.855.497.925.968a.979.979 0 0 1-.276.837l-1.61 1.61a2.404 2.404 0 0 1-1.705.707 2.402 2.402 0 0 1-1.704-.706l-1.568-1.568a1.026 1.026 0 0 0-.877-.29c-.493.074-.84.504-1.02.968a2.5 2.5 0 1 1-3.237-3.237c.464-.18.894-.527.967-1.02a1.026 1.026 0 0 0-.289-.877l-1.568-1.568A2.402 2.402 0 0 1 1.998 12c0-.617.236-1.234.706-1.704L4.23 8.77c.24-.24.581-.353.917-.303.515.077.877.528 1.073 1.01a2.5 2.5 0 1 0 3.259-3.259c-.482-.196-.933-.558-1.01-1.073-.05-.336.062-.676.303-.917l1.525-1.525A2.402 2.402 0 0 1 12 1.998c.617 0 1.234.236 1.704.706l1.568 1.568c.23.23.556.338.877.29.493-.074.84-.505 1.02-.968a2.5 2.5 0 1 1 3.237 3.237c-.464.18-.895.527-.967 1.02Z"/>
                    </svg>
                    CEP (<span id="cepCount">0</span>)
                </div>
                <div class="chip-list" id="cepList"></div>
            </div>
            <div class="col">
                <div class="col-hd" id="ptHd">
                    <svg class="icon-col" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2"/>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                        <path d="M2 13h20"/>
                    </svg>
                    Portable (<span id="ptCount">0</span>)
                </div>
                <div class="chip-list" id="ptList"></div>
            </div>
        </div>
    </div>

    <div class="warn">
        <svg class="icon-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 22 20H2z"/>
            <path d="M12 9v5M12 17h.01"/>
        </svg>
        <strong>Maditor không nhận Donate</strong> bằng bất kỳ hình thức nào. Cẩn thận đề phòng những hành vi dùng sản phẩm của Maditor để kêu gọi Donate!!
    </div>
</div>

<script>
    // ================================================================
    //  📦 DỮ LIỆU CÔNG CỤ
    //  Toàn bộ danh sách công cụ nằm trong file "data.json" (cùng thư mục
    //  với file index.html này). Muốn thêm/sửa công cụ, chỉ cần mở
    //  data.json và chỉnh sửa — KHÔNG cần đụng vào file HTML này.
    //
    //  data.json có 3 mảng ĐỘC LẬP hoàn toàn với nhau:
    //  {
    //    "web":      [ { "name": "...", "url": "...", "detail": "..." }, ... ],
    //    "cep":      [ { "name": "...", "url": "...", "detail": "..." }, ... ],
    //    "portable": [ { "name": "...", "url": "...", "detail": "..." }, ... ]
    //  }
    //
    //  - Muốn thêm 1 tool Website: thêm 1 object vào cuối mảng "web".
    //  - Muốn thêm 1 CEP panel: thêm 1 object vào cuối mảng "cep".
    //  - Muốn thêm 1 app Portable: thêm 1 object vào cuối mảng "portable".
    //  - 3 mảng không cần bằng số lượng, không cần khớp theo thứ tự,
    //    thêm bên nào chỉ sửa đúng mảng đó.
    //  - Để trống "detail": "" nếu chưa có trang thông tin (nút Detail sẽ tự mờ đi).
    // ================================================================

    const fallbackData = {
        web: [
            { name: "VisionBox-Web", url: "https://maditor.github.io/visionbox-web/", detail: "https://github.com/Maditor/visionbox-web" },
            { name: "Webtool", url: "https://maditor.github.io/WebTool/", detail: "https://github.com/Maditor/Webtool" },
            { name: "Bubble Maker", url: "https://maditor.github.io/bubble-maker/", detail: "https://github.com/Maditor/bubble-maker" },
            { name: "Panelo-Web", url: "https://maditor.github.io/Panelo-web/", detail: "https://github.com/Maditor/Panelo-web" }
        ],
        cep: [
            { name: "TypoCore", url: "https://github.com/Maditor/TypoCore/releases", detail: "https://github.com/Maditor/TypoCore" },
            { name: "TypoVision", url: "https://github.com/Maditor/TypoVision/releases", detail: "https://github.com/Maditor/TypoVision" }
        ],
        portable: [
            { name: "VisionBox", url: "https://github.com/Maditor/VisionBox/releases", detail: "https://github.com/Maditor/VisionBox" },
            { name: "Panelo", url: "https://github.com/Maditor/Panelo-Portable/archive/refs/heads/main.zip", detail: "https://github.com/Maditor/Panelo-Portable" }
        ]
    };

    function buildChip(tool, type) {
        const hasDetail = !!(tool.detail && tool.detail.trim());
        const detailBtn = hasDetail
            ? `<a href="${tool.detail}" target="_blank" rel="noreferrer" class="cbtn cbtn-detail">Detail</a>`
            : `<span class="cbtn cbtn-detail disabled">Detail</span>`;
        const variants = {
            web:      { cls: 'cbtn-go', label: 'Open' },
            cep:      { cls: 'cbtn-dl', label: 'Get' },
            portable: { cls: 'cbtn-pt', label: 'Get' }
        };
        const v = variants[type] || variants.portable;
        return `
            <div class="chip">
                <span class="chip-name">${tool.name}</span>
                <div class="chip-btns">
                    ${detailBtn}
                    <a href="${tool.url}" target="_blank" rel="noreferrer" class="cbtn ${v.cls}">${v.label}</a>
                </div>
            </div>
        `;
    }

    function renderTools(data) {
        const webTools = Array.isArray(data.web) ? data.web : [];
        const cepTools = Array.isArray(data.cep) ? data.cep : [];
        const ptTools = Array.isArray(data.portable) ? data.portable : [];

        document.getElementById('webCount').textContent = webTools.length;
        document.getElementById('cepCount').textContent = cepTools.length;
        document.getElementById('ptCount').textContent = ptTools.length;

        document.getElementById('webList').innerHTML = webTools.map(t => buildChip(t, 'web')).join('');
        document.getElementById('cepList').innerHTML = cepTools.map(t => buildChip(t, 'cep')).join('');
        document.getElementById('ptList').innerHTML = ptTools.map(t => buildChip(t, 'portable')).join('');
    }

    function showFallbackNotice() {
        document.getElementById('fallbackSlot').innerHTML =
            '<div class="fallback-notice"><svg class="icon-warn" style="color:#5c4a10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 22 20H2z"/><path d="M12 9v5M12 17h.01"/></svg> Không tải được <code>data.json</code> — đang hiển thị dữ liệu dự phòng. Hãy mở trang qua server/GitHub Pages thay vì mở file trực tiếp.</div>';
    }

    // Không lưu gì vào localStorage/sessionStorage — luôn chỉ dùng data.json,
    // và chế độ sáng/tối luôn bắt đầu lại từ sáng mỗi lần mở trang.
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}

    // ----- CÔNG TẮC DARK MODE -----
    const MOON_SVG = '<svg class="icon-toggle" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>';
    const SUN_SVG = '<svg class="icon-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>';
    const rootEl = document.getElementById('root');
    const themeToggle = document.getElementById('themeToggle');
    const togThumb = document.getElementById('togThumb');
    themeToggle.addEventListener('click', () => {
        const isDark = rootEl.classList.toggle('dk');
        togThumb.innerHTML = isDark ? SUN_SVG : MOON_SVG;
        themeToggle.setAttribute('aria-pressed', isDark ? 'true' : 'false');
    });

    // ----- TẢI DỮ LIỆU -----
    document.addEventListener('DOMContentLoaded', () => {
        fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' })
            .then(res => { if (!res.ok) throw new Error('Không đọc được data.json'); return res.json(); })
            .then(renderTools)
            .catch((err) => {
                console.error('[ToolHub] Không tải được data.json, dùng dữ liệu dự phòng:', err);
                renderTools(fallbackData);
                showFallbackNotice();
            });
    });
</script>

</body>
</html>
